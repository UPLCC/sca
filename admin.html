<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>UPLCC-Background Admin</title>
  <style>
    *{
      margin:0;
      padding:0;
      font-weight:300;
      font-size:16px;
    }
    body{
      background-color:rgba(0,0,0,0.03);
    }
    #topD{
      position:fixed;
      top:0;
      width:100vw;
      height:44px;
      background-color:rgba(255,255,255,0.7);
      padding:4px;
      box-sizing:border-box;
      backdrop-filter:blur(10px);
      user-select:none;
      z-index:100;
       }
    #logo{
      position:absolute;
      top:50%;
      transform:translate(0%,-50%);
      width:100px;
    }
    .ticklingData{
      width:90vw;
      background-color:rgba(255,255,255,0.9);
      backdrop-filter:blur(10px);
      min-height:60px;
      border-radius:12px;
      margin:8px auto;
      padding:12px;
      box-sizing:border-box;
    }
    .questionText{
      cursor:pointer;
      color:#333;
      line-height:1.6;
    }
    .answerText{
      margin-top:8px;
      padding-top:8px;
      border-top:1px solid rgba(0,0,0,0.1);
      color:#666;
      font-size:14px;
      line-height:1.6;
    }
    .replyBtn{
      margin-top:8px;
      padding:6px 12px;
      background-color:rgba(0,0,0,0.03);
      border:0;
      border-radius:6px;
      cursor:pointer;
    }
    .replyBtn:hover{
      background-color:rgba(0,0,0,0.06);
    }
    .deleteBtn{
      background-color:rgba(255,100,100,0.1);
      color:#ff4444;
    }
    .deleteBtn:hover{
      background-color:rgba(255,100,100,0.2);
    }
    #reDB{
      display:block;
      width:fit-content;
      margin:20px auto;
      color:rgba(51,136,255,0.7);
      cursor:pointer;
    }
  </style>
</head>
<body>	
  <div id="topD">
    <img src="logo.png" id="logo"/>
  </div>
</body>
<script>
  const basekey="dXBsY2NrZXkxMjM0NTY=";
  let questionMap=new Map();
  function escapeHtml(str){
    return str.replace(/&/g,"&amp;")
              .replace(/</g,"&lt;")
              .replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;")
              .replace(/'/g,"&#039;");
  }
  function changeString(str){
      return str.replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")
                .replace(/\n/g,"<br>")
                .replace(/\"([\s\S]+?)\"/g,t=>{
                  return t.replace(/\*/g,"UPLCCXINGHAOBIAOJI").replace(/\#/g,"UPLCCJINGHAOBIAOJI");
                })
                .replace(/\'([\s\S]+?)\'/g,t=>{
                  return t.replace(/\*/g,"UPLCCXINGHAOBIAOJI").replace(/\#/g,"UPLCCJINGHAOBIAOJI");
                })
                .replace(/\`([\s\S]+?)\`/g,t=>{
                  return t.replace(/\*/g,"UPLCCXINGHAOBIAOJI").replace(/\#/g,"UPLCCJINGHAOBIAOJI");
                })
                .replace(/\*\*([\s\S]+?)\*\*/g,`<span style="font-weight:500">$1</span>`)
                .replace(/UPLCCXINGHAOBIAOJI/g,"*")
                .replace(/######(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:17px;">$1</h3>`)
                .replace(/#####(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:18px;">$1</h3>`)
                .replace(/####(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:19px;">$1</h3>`)
                .replace(/###(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:20px;">$1</h3>`)
                .replace(/##(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:21px;">$1</h3>`)
                .replace(/#(.*?)(?:$|<br>|\s)/gm,`<h3 style="font-size:22px;">$1</h3>`)
                .replace(/UPLCCJINGHAOBIAOJI/g,"#");
  }
  function escapeJs(str){
    return str.replace(/\\/g,"\\\\")
              .replace(/'/g,"\\'")
              .replace(/"/g,"\\'")
              .replace(/\n/g,"\\n")
              .replace(/\r/g,"\\r");
  }
  async function updateData(){
    const res=await fetch("https://sca.deno.dev/udb?method=get&key=uplcc").then(t=>t.json()).catch(e=>{alert(e);return{code:0,message:[]};});
    if(res.code!==200)return;
    document.querySelectorAll('.ticklingData').forEach(e=>e.remove());
    document.querySelectorAll('#reDB').forEach(e=>e.remove());
    questionMap.clear();
    for(var i=0;i<res.message.length;i++){
      let item;
      try{
        item=JSON.parse(res.message[i]);
      }catch(e){
        continue;
      }
      if(!item.question)continue;
      questionMap.set(item.question,i);
      let displayText=item.question;
      if(displayText.length>20)displayText=displayText.slice(0,20)+"...";
      const ele=document.createElement("div");
      ele.className="ticklingData";
      ele.id="tickling"+i;
      let html=`<div class="questionText" onclick="alert('${escapeJs(item.question)}')">${changeString(displayText)}</div>`;
      if(item.answer){
        html+=`<div class="answerText">${changeString(item.answer)}</div>`;
      }else{
        html+=`<button class="replyBtn" onclick="doReply('${escapeJs(item.question)}')">回复</button>
<button class="replyBtn deleteBtn" onclick="doDelete('${escapeJs(item.question)}')">删除</button>`;
      }
      ele.innerHTML=html;
      document.body.appendChild(ele);
    }
    const firstEle=document.querySelector(".ticklingData");
    if(firstEle)firstEle.style.marginTop="56px";
    const reele=document.createElement("span");
    reele.id="reDB";
    reele.innerText="重置数据库";
    reele.onclick=async()=>{
      let canReDB;
      const pw=window.prompt("请输入重置密钥");
      if(pw===atob(basekey)){
        canReDB=window.confirm("确定重置数据库嘛？");
      }
      if(canReDB){
        const redbresult=await fetch("https://sca.deno.dev/udb?method=set&key=uplcc&value=[]&type=array").then(t=>t.json());
        if(redbresult.code===200){
          alert("重置成功");
          updateData();
        }else{
          alert("重置失败");
        }
      }
    };
    document.body.appendChild(reele);
  }
  function doReply(question){
    let answer=prompt("回复："+question);
    if(!answer||!answer.trim())return;
    answer=answer.replace(/\\n/g,"\n");
    const index=questionMap.get(question);
    if(index===undefined){
      alert("错误");
      return;
    }
    fetch("https://sca.deno.dev/udb?method=put&key=uplcc&index="+index+"&value="+encodeURIComponent(JSON.stringify({question:question,answer:answer}))).then(t=>t.json()).then(res=>{
      if(res.code===200){
        updateData();
      }else{
        alert("回复失败");
      }
    });
  }
  function doDelete(question){
    if(!confirm("确定删除这条反馈吗？"))return;
    const index=questionMap.get(question);
    if(index===undefined){
      alert("错误");
      return;
    }
    fetch("https://sca.deno.dev/udb?method=put&key=uplcc&index="+index+"&value="+encodeURIComponent(JSON.stringify({question:"",answer:""}))).then(t=>t.json()).then(res=>{
      if(res.code===200){
        updateData();
      }else{
        alert("删除失败");
      }
    });
  }
  updateData();
  setInterval(()=>updateData(),5000);
</script>
</html>
