<!DOCTYPE html>
<html>
  <head>
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>UPLCC-Show</title>
  </head>
  <style>
    *{
      margin:0;
      padding:0;
    }
    #information{
      position:absolute;
      margin:8px;
      font-size:17px;
      max-width:100vw;
      overflow-wrap:break-word;
    }
    .displaynews{
      color:gray;
      font-size:13px;
    }
    hr{
      position:absolute;
      width:98vw;
      left:1vw;
      margin-left:-8px;
    }
    .codea{
      position:relative;
      width:98%;
      background-color:rgba(0,0,0,0.05);
      border-radius:7px;
      padding:1%;
      overflow-x:auto;
      font-size:15px;
    }
    .codeb{
      display:inline-block;
      background-color:rgba(0,0,0,0.05);
      border-radius:5px;
    }
  </style>
  <body>	
	<p id="information"></p>
  </body>
  <script>
    function shows(){
      const newsq=localStorage.getItem("uplccnews");
      if(!newsq){
        document.getElementById("information").innerHTML="没有消息";
        return;
      }
      const news=newsq.split("NEXT://");
      let udisplay="";
      let num=0;
      for(let thisnews of news){
        num++;
        thisnews=thisnews;
        if(thisnews.substring(0,7)=="USER://"){
          udisplay+=`USER://${thisnews.replace("USER://","")}//:USER`;
        }else{
          udisplay+=`<p class="displaynews">回答</p>${thisnews.replace(/&lt;br&gt;/g,"<br>")}`;
        }
        if(num!==news.length){
          udisplay+="<br><hr/><br>";
        }
      }
      document.getElementById("information").innerHTML=udisplay
        .replace(/USER:\/\/([\s\S]*?)\/\/:USER/g,(t)=>{
          return `<p class="displaynews">用户</p>${t.replace("USER://","").replace("//:USER","")}`;
        });
    }
    shows();
  </script>
</html>
