<!DOCTYPE html>
<html>
  <head>
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>UPLCC Show</title>
    <style>
      *{
        margin:0;
        padding:0;
        overflow-wrap:break-word;
        word-wrap:break-word;
        box-sizing:border-box;
      }
      table{
        border-collapse: collapse;
        margin: 1em 0;
      }
      th,td{
        border: 1px solid #d0d7de;
        padding: 6px 13px;
      }
      blockquote{
        padding:0 1em;
        color:#656d76;
        border-left:0.25em solid #d0d7de;
        margin-left:0;
      }
      .tableDiv{
        width:100%;
        overflow-x:auto;
      }
      a{
        text-decoration:none;
        color:black;
        font-weight:700;
      }
      .codea{
        position:relative;
        width:98%;
        background-color:rgba(0,0,0,0.03);
        border-radius:7px;
        padding:1%;
        overflow-x:auto;
      }
      .userDiv{
        position:relative;
        padding:10px;
        margin:10px;
        box-sizing:border-box;
        background-color:rgba(0,0,0,0.03);
        border-radius:13px;
        min-width:40px;
        max-width:80vw;
        margin-right:5vw;
        margin-left:auto;
        width:fit-content;
        max-height:6000px;
        overflow:auto;
        overflow-wrap:break-word;
      }
      .contentDiv{
        position:relative;
        width:94vw;
        max-width:94vw;
        background-color:rgba(0,0,0,0);
        margin-top:10px;
        margin-bottom:10px;
        margin-left:3%;
        margin-right:3%;
        box-sizing:border-box;
        overflow-x:auto;
        overflow-wrap:break-word;
      }
    </style>
  </head>
  <body>
  </body>
  <script>
    let information=[];
    const limit=100;
    function getInformation(){
      const got=localStorage.getItem("uplcc_sca_information");
      if(got==null){
        localStorage.setItem("uplcc_sca_information",JSON.stringify([]));
        return null;
      }else{
        const res=JSON.parse(got);
        if(Array.isArray(res)){
          if(res.length>0){
            if(res.length<=limit){
              return res;
            }else{
              res.splice(0,res.length-limit);
              localStorage.setItem("uplcc_sca_information",JSON.stringify(res));
              return res;
            }
          }else{
            return null;
          }
        }else{
          return null;
        }
      }
    }
    function addIntoHtml(){
      information=[];
      const res=getInformation();
      if(res!==null){
        for(let i=res.length-1;i>=0;i--){
          information.push(res[i]);
        }
        for(let j=0;j<information.length;j++){
          const userDiv=document.createElement("div");
          userDiv.className="userDiv";
          userDiv.innerHTML=information[j].user;
          const contentDiv=document.createElement("div");
          contentDiv.className="contentDiv";
          contentDiv.innerHTML=information[j].content;
          document.body.append(userDiv,contentDiv);
        }
      }else{
        const contentDiv=document.createElement("div");
        contentDiv.className="contentDiv";
        contentDiv.innerHTML="没有消息。";
        document.body.appendChild(contentDiv);
      }
    }
    addIntoHtml();
  </script>
</html>
